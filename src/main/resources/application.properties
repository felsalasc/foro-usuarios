spring.application.name=foro-usuarios
spring.profiles.default=local
spring.jpa.open-in-view=false
server.port=${PORT:8081}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
security.jwt.secret-base64=${JWT_SECRET_BASE64}
spring.jackson.deserialization.fail-on-numbers-for-enums=true
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.nombre=${BOOTSTRAP_ADMIN_NOMBRE:}
app.bootstrap.correo=${BOOTSTRAP_ADMIN_CORREO:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
